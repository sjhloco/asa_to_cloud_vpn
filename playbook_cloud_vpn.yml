---
- name: Azure to ASA site-to-site VPN
  hosts: localhost

  tasks:
    # 1. Get remote end (non-cloud) public IP address
    - name: BLK >> Get local Public IP address
      tags: [deploy, vpn_up]
      check_mode: false
      block:
        - name: SYS >> Getting local Public IP address
          community.general.ipify_facts:
        - name: SYS >> Creating fact for Local public IP
          ansible.builtin.set_fact:
            rmte_public_ip: "{{ ansible_facts.ipify_public_ip }}"

    # 2. Azure Role for the creation of the Azure end of the VPN must be run before gathering the Azure public IP address
    - name: ROLE >> Azure Configuration
      ansible.builtin.include_role:
        name: az
      tags: [deploy, vpn_up]

    # 3. Get and create a fact from the Azure public IP address - Hand-off to the ASA play (read as hostvars.localhost.cld_public_ip)
    # Can be set manually (-e or group_vars) instead, extra vars take precedence over this fact and skip the lookup. See README.
    - name: BLK >> Get Azure public IP address
      when: cld_public_ip is not defined
      check_mode: false
      tags: [destroy, vpn_down, deploy, vpn_up]
      block:
        - name: CLD >> Getting Azure public IP
          azure.azcollection.azure_rm_publicipaddress_info:
            resource_group: "{{ az_rg_name }}"
            name: "{{ az_public_ip_name }}"
          register: az_pip_info
        # Exits script if no public IP in Azure as ASA cant run without this
        - name: SYS >> Checking there is an Azure public IP
          ansible.builtin.fail:
            msg: No Azure public IP present so playbook aborted. Cant run the ASA elements without this (set it with -e cld_public_ip=x.x.x.x)
          when: az_pip_info.publicipaddresses | length == 0
        - name: SYS >> Creating fact for Azure public IP
          ansible.builtin.set_fact:
            cld_public_ip: "{{ az_pip_info.publicipaddresses[0].ip_address }}"

    # 4. Azure Role for the deletion of the Azure end of the VPN must be run after gathering the the Azure public IP address
    - name: ROLE >> Azure Configuration
      ansible.builtin.include_role:
        name: az
      tags: [destroy, vpn_down]

# # 5. Run all the plays to create the ASA end of the VPN
- name: ROLE >> ASA Configuration
  hosts: asa
  roles:
    - asa
