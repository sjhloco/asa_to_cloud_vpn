# Print the output of any commands, even in checkmode when not appleid to ASA
- name: SYS >> Print VPN config changes
  listen: vpn_config
  ansible.builtin.debug:
    # vpn_down registers its two tasks separately (asa_vpn_dest, asa_vpn_tg) as a handler only runs once so would only show the last
    # The PSK is masked so it isn't printed (or written to ansible.log)
    msg: >-
      {{ ((asa_vpn_config | default({})).updates | default([])
      + (asa_vpn_dest | default({})).updates | default([])
      + (asa_vpn_tg | default({})).updates | default([]))
      | map('regex_replace', 'pre-shared-key .*$', 'pre-shared-key ********') | list }}
