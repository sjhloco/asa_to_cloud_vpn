---
all:
  hosts:
    # Explicit so --limit localhost works (Azure-only run). Interpreter is the uv venv python (has the Azure SDK), as the implicit localhost used
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    firewall:
      children:
        asa:
          vars:
            ansible_network_os: cisco.asa.asa
            ansible_connection: ansible.netcommon.network_cli
          hosts:
            ASA-FW1:
              ansible_host: 192.168.1.106
